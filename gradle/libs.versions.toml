[versions]
gradle = "9.7.1"
jnats = "2.26.3"
junit = "6.1.3"
jvm = "25"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
logback = "1.6.3"
pekko = "1.7.0"
pekko-connectors = "1.3.0"

[libraries]
jnats = { group = "io.nats", name = "jnats", version.ref = "jnats" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
pekko-actor-testkit-typed = { group = "org.apache.pekko", name = "pekko-actor-testkit-typed_3", version.ref = "pekko" }
pekko-actor-typed = { group = "org.apache.pekko", name = "pekko-actor-typed_3", version.ref = "pekko" }
pekko-bom = { group = "org.apache.pekko", name = "pekko-bom_3", version.ref = "pekko" }
pekko-connectors-udp = { group = "org.apache.pekko", name = "pekko-connectors-udp_3", version.ref = "pekko-connectors" }
pekko-slf4j = { group = "org.apache.pekko", name = "pekko-slf4j_3", version.ref = "pekko" }
pekko-stream = { group = "org.apache.pekko", name = "pekko-stream_3", version.ref = "pekko" }

[bundles]
central = [
    "jnats",
    "pekko-actor-typed",
    "pekko-slf4j",
    "pekko-stream"
]
test = [
    "kotlin-test-junit5",
    "pekko-actor-testkit-typed"
]
warehouse = [
    "jnats",
    "pekko-actor-typed",
    "pekko-connectors-udp",
    "pekko-slf4j",
    "pekko-stream"
]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
