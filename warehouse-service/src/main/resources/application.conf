warehouse {
  id = "w1"
  id = ${?WAREHOUSE_ID}

  nats-url = "nats://127.0.0.1:4222"
  nats-url = ${?NATS_URL}

  sensors = [
    { kind = TEMPERATURE, host = "0.0.0.0", port = 3344 },
    { kind = HUMIDITY, host = "0.0.0.0", port = 3355 }
  ]
}

pekko {
  loglevel = INFO
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
}
