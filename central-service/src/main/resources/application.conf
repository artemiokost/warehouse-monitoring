central {
  thresholds {
    TEMPERATURE = 35.0
    HUMIDITY = 50.0
  }
}

nats {
  url = "nats://127.0.0.1:4222"
  url = ${?NATS_URL}

  measurement-subject = "warehouse.*.measurement"
  measurement-subject = ${?MEASUREMENT_SUBJECT}
}

pekko {
  loglevel = INFO
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
}
